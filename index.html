
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inner Doll ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff0f5;
    color: #70445a;
    font-family: "Georgia", serif;
}

.main {
    margin-top: 110px;
    width: 80%;
    min-height: 600px;
    margin-left: 10%;
    background: #fce3ed;
    padding: 35px;
    border: 2px dashed #d998b6;
    border-radius: 20px;
}

.inner {
    width: 60%;
    min-height: 400px;
    background: #ffe9a8;
    margin-left: 20%;
    padding: 35px 20px;
    border: 2px solid #e6b9c9;
    border-radius: 20px;
    text-align: center;
    box-shadow: 5px 5px 0 #edc3d5;
}

.header {
    width: 100%;
    height: 100px;
    background: #d9b8ed;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10;
    border-bottom: 3px dashed #a57cbb;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #70445a;
    font-size: 22px;
}

h1 {
    color: #b45f88;
}

p {
    line-height: 1.9;
    font-size: 17px;
}

.lace {
    font-size: 25px;
    color: #bd7298;
}
</style>
</head>

<body>
    <div class="header">
        ୨୧ ♡ ANGEL DOLL ♡ ୨୧
    </div>

    <div class="main">
        <div class="inner">
            <div class="lace">୨୧ ₊˚⊹♡</div>

            <h1>Welcome to my dream</h1>

            <p>
                A porcelain heart beneath
                the moonlight.
                <br>
                Pink ribbons, quiet wishes,
                and a world of my own.
            </p>

            <div class="lace">♡ lace &amp; stardust ♡</div>
        </div>
    </div>
</body>
</html>
